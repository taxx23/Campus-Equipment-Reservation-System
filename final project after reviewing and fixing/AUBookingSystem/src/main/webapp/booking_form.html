<!DOCTYPE html>
<html>
<head>
    <title>Campus Equipment Reservation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f1e8;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #654b3c;
            margin-top: 40px;
        }
        
        h3 {
            text-align: center;
            color: #987762;
            font-weight: normal;
            margin-top: 15px;
        }

        form {
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            background-color: #fffaf4;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(101, 75, 60, 0.12);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #654b3c;
        }

        input, select {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #ddc9b8;
            border-radius: 5px;
            background-color: #fffdfb;
            color: #49382e;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #bd8065;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 25px;
            background-color: #b87559;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #985c45;
        }
    </style>
</head>

<body>

    <h1>Campus Equipment Reservation</h1>
    
    <h3>Fill the following form to submit your booking request.</h3>

    <form action="ReservationServlet" method="POST">

        <label for="userName">Username:</label>
        <input type="text" id="userName" name="userName" placeholder="Insert your first name" required>

        <label for="userRole">Role:</label>
        <select id="userRole" name="userRole" required>
            <option value="">Select your role</option>
            <option value="Student">Student</option>
            <option value="Faculty">Faculty</option>
        </select>

        <label for="itemCategory">Item Category:</label>
        <select id="itemCategory" name="itemCategory" required>
            <option value="">Select an item</option>
            <option value="Laptop">Laptop</option>
            <option value="Projector">Projector</option>
            <option value="POD">Study Pod</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" required>

        <label for="bookingDays">Booking Days (max 90 days):</label>
        <input type="number" id="bookingDays" name="bookingDays" min="1" max="90" required>

        <button type="submit">Submit Request</button>

    </form>

</body>
</html>
